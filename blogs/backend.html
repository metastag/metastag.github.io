<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beauty of Automata Theory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #0d0e12;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .main-content {
            padding: 60px 0;
        }

        .blog-header {
            margin-bottom: 40px;
        }

        .blog-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #778da9;
        }

        .blog-date {
            color: #8d99ae;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .blog-content h4 {
            color: #778da9;
            margin: 30px 0 15px 0;
            font-size: 1.3rem;
        }

        .blog-content p {
			color: #8d99ae;
            margin-bottom: 20px;
            line-height: 1.7;
            font-size: 1rem;
        }

        .back-link {
            text-align: center;
            margin-top: 50px;
        }

        .back-link a {
            color: #8d99ae;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #8d99ae;
            font-weight: normal;
            transition: color 0.2s ease;
            padding: 10px 20px;
        }

        .back-link a:hover {
            color: #a8b3c8;
            text-decoration-color: #a8b3c8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .blog-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <header class="blog-header">
                <h1 class="blog-title">Backend Systems</h1>
                <div class="blog-date">28 October, 2025</div>
            </header>

            <article class="blog-content">
                <p>Introduction</p>
                
                <h4>Heading 1</h4>
                <p>Paragraph</p>
                
                <p>Paragraph 2</p>

                <h4>Heading 2</h4>
                <p>Paragraph 3</p>

                <p>Paragraph 4</p>
                
            </article>

            <div class="back-link">
                <a href="../blog.html">blog</a>
            </div>
        </div>
    </main>
</body>
</html>
